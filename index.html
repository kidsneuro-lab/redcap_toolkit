<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- GitHub Pages cannot send headers. server.js sends the full policy, including frame-ancestors, which a meta tag cannot set. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Read-only tools for the schemas of classic REDCap projects.">
  <title>REDCap Toolkit</title>
  <script src="src/theme.js"></script>
  <link rel="stylesheet" href="vendor/tabler/1.7.5/tabler.min.css">
  <link rel="stylesheet" href="toolkit.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <!-- Icons: @tabler/icons 3.52.0 outline menu-2, database and moon (MIT, vendor/tabler-icons/3.52.0/LICENSE). -->
  <div class="page">
    <header class="navbar navbar-expand-md d-print-none">
      <div class="container-xl">
        <button id="nav-toggle" class="navbar-toggler" type="button" aria-controls="navbar-tools" aria-expanded="false" aria-label="Show Tools"><svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l16 0"/><path d="M4 12l16 0"/><path d="M4 18l16 0"/></svg></button>
        <a class="navbar-brand pe-md-3" href="#/compare"><svg xmlns="http://www.w3.org/2000/svg" class="icon me-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0"/><path d="M4 6v6a8 3 0 0 0 16 0v-6"/><path d="M4 12v6a8 3 0 0 0 16 0v-6"/></svg>REDCap Toolkit</a>
        <div class="navbar-nav flex-row order-md-last gap-2 align-items-center">
          <button id="theme-toggle" class="btn btn-ghost-secondary btn-icon" type="button" aria-label="Dark mode" aria-pressed="false"><svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454l0 .008"/></svg></button>
          <div id="projects-trigger"></div>
        </div>
        <div id="navbar-tools" class="collapse navbar-collapse">
          <nav aria-label="Tools"><ul id="tool-links" class="navbar-nav"></ul></nav>
        </div>
      </div>
    </header>
    <div class="page-wrapper">
      <div class="page-body">
        <div class="container-xl">
          <div id="notice" class="alert alert-info text-pre-wrap text-break d-print-none" role="status" hidden></div>
          <main id="tools"></main>
          <footer class="footer footer-transparent border-top mt-4 d-print-none">Read-only REDCap exports. A schema comparison match covers only the exported settings.</footer>
        </div>
      </div>
    </div>
  </div>
  <div id="projects"></div>
</body>
</html>
